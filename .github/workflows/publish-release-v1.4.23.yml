name: Publish Android 1.4.23 release

on:
  push:
    branches: [main]
    paths:
      - dist/chunks-1.4.23/**
      - dist/SHA256SUMS-1.4.23.txt
      - dist/release-notes-1.4.23.md
      - dist/verification-1.4.23.json
      - .github/workflows/publish-release-v1.4.23.yml

  workflow_dispatch:
    inputs:
      publish:
        description: Publish this verified Android release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-v1.4.23
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || inputs.publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reassemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          : > dist/dhy-server-console-1.4.23.apk
          for chunk in $(find dist/chunks-1.4.23 -maxdepth 1 -type f -name "*.b64" | sort); do
            base64 --decode "$chunk" >> dist/dhy-server-console-1.4.23.apk
          done
          (cd dist && sha256sum --check SHA256SUMS-1.4.23.txt)
          unzip -t dist/licenses-and-notices-1.4.23.zip
          test -s dist/verification-1.4.23.json
          grep -q '"version": "1.4.23"' dist/verification-1.4.23.json
          grep -q '"signerContinuityVerified": true' dist/verification-1.4.23.json
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.23 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v1.4.23 --repo "$GH_REPO" --target "$GH_SHA" \
            --title 'dhy 服务器简易控制台 v1.4.23' \
            --notes-file dist/release-notes-1.4.23.md --draft
          gh release upload v1.4.23 --repo "$GH_REPO" \
            dist/dhy-server-console-1.4.23.apk \
            dist/licenses-and-notices-1.4.23.zip \
            dist/SHA256SUMS-1.4.23.txt \
            dist/verification-1.4.23.json
          gh release edit v1.4.23 --repo "$GH_REPO" --draft=false --latest
