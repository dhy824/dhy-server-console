name: Publish Android 1.3.0 release

on:
  push:
    branches: ['release/v1.3.0']
    paths:
      - 'dist/**'
      - '.github/workflows/publish-release-v1.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
      - name: Check release files
        shell: bash
        run: (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v1.3.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create v1.3.0 --repo "$GH_REPO" --target "$GH_SHA" --title "dhy 服务器简易控制台 v1.3.0" --notes-file dist/release-notes.md --draft
          fi
          gh release upload v1.3.0 --repo "$GH_REPO" dist/dhy-server-console-1.3.0.apk dist/licenses-and-notices.zip dist/SHA256SUMS.txt dist/verification.json --clobber
          gh release edit v1.3.0 --repo "$GH_REPO" --draft=false --latest
