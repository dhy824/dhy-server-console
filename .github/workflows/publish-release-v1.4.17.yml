name: Publish Android 1.4.17 release

on:
  push:
    branches: [main]
    paths:
      - dist/chunks-1.4.17/**
      - dist/SHA256SUMS-1.4.17.txt
      - dist/release-notes-1.4.17.md
      - dist/verification-1.4.17.json
      - .github/workflows/publish-release-v1.4.17.yml

permissions:
  contents: write

concurrency:
  group: android-release-v1.4.17
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reassemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          : > dist/dhy-server-console-1.4.17.apk
          for chunk in $(find dist/chunks-1.4.17 -maxdepth 1 -type f -name "*.b64" | sort); do base64 --decode "$chunk" >> dist/dhy-server-console-1.4.17.apk; done
          (cd dist && sha256sum --check SHA256SUMS-1.4.17.txt)
          test -s dist/verification-1.4.17.json
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.17 --repo "$GH_REPO" >/dev/null 2>&1; then echo 'Release already exists; refusing to overwrite.'; exit 1; fi
          gh release create v1.4.17 --repo "$GH_REPO" --target "$GH_SHA" --title 'dhy 服务器简易控制台 v1.4.17' --notes-file dist/release-notes-1.4.17.md --draft
          gh release upload v1.4.17 --repo "$GH_REPO" dist/dhy-server-console-1.4.17.apk dist/licenses-and-notices.zip dist/SHA256SUMS-1.4.17.txt dist/verification-1.4.17.json
          gh release edit v1.4.17 --repo "$GH_REPO" --draft=false --latest
