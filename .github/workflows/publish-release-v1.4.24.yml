name: Publish Android 1.4.24 release

on:
  push:
    branches: [main]
    paths:
      - dist/chunks-1.4.24/**
      - dist/SHA256SUMS-1.4.24.txt
      - dist/release-notes-1.4.24.md
      - dist/verification-1.4.24.json
      - .github/workflows/publish-release-v1.4.24.yml

  workflow_dispatch:
    inputs:
      publish:
        description: Publish this verified Android release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-v1.4.24
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || inputs.publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify public source manifest
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("source-export.json").read_text(encoding="utf-8"))
          for name, expected in manifest["files"].items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Public source digest mismatch for {name}")
      - name: Reassemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          : > dist/dhy-server-console-1.4.24.apk
          for chunk in $(find dist/chunks-1.4.24 -maxdepth 1 -type f -name "*.b64" | sort); do
            base64 --decode "$chunk" >> dist/dhy-server-console-1.4.24.apk
          done
          (cd dist && sha256sum --check SHA256SUMS-1.4.24.txt)
          unzip -t dist/licenses-and-notices-1.4.24.zip
          test -s dist/verification-1.4.24.json
          grep -q '"version": "1.4.24"' dist/verification-1.4.24.json
          grep -q '"signerContinuityVerified": true' dist/verification-1.4.24.json
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.24 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v1.4.24 --repo "$GH_REPO" --target "$GH_SHA" \
            --title 'dhy 服务器简易控制台 v1.4.24' \
            --notes-file dist/release-notes-1.4.24.md --draft
          gh release upload v1.4.24 --repo "$GH_REPO" \
            dist/dhy-server-console-1.4.24.apk \
            dist/licenses-and-notices-1.4.24.zip \
            dist/SHA256SUMS-1.4.24.txt \
            dist/verification-1.4.24.json
          gh release edit v1.4.24 --repo "$GH_REPO" --draft=false --latest
